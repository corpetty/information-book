<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lossy — Ontology</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Vendored (src/vendor/*.js) rather than CDN-loaded: the published book
       site shouldn't put a third-party CDN in its trust boundary, and the
       viewer should work offline / on CDN outage.

       Load order matters — these are plain UMD globals with a dependency
       chain, and classic <script> tags run synchronously in order:
         cytoscape            → window.cytoscape  (v3.30.4)
         dagre                → window.dagre      (layered/hierarchical algo)
         cytoscape-dagre      → window.cytoscapeDagre   (needs window.dagre)
         layout-base          → window.layoutBase
         cose-base            → window.coseBase   (needs window.layoutBase)
         cytoscape-fcose      → window.cytoscapeFcose   (needs window.coseBase)
       app.js (a module, so deferred) calls cytoscape.use(...) for each. -->
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.js"></script>
  <script src="vendor/layout-base.js"></script>
  <script src="vendor/cose-base.js"></script>
  <script src="vendor/cytoscape-fcose.js"></script>
</head>
<body>
  <header>
    <button class="brand" id="home-link" type="button" title="Back to start">
      <h1>Lossy — Ontology</h1>
      <div id="stats">loading…</div>
    </button>
    <nav id="view-tabs" aria-label="View"></nav>
    <button id="mode-toggle" type="button" class="mode-toggle" aria-pressed="false" title="Switch to the full author tools">Author tools</button>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search nodes…" autocomplete="off" />
      <button id="search-clear" title="Clear search" type="button" aria-label="Clear">×</button>
    </div>
  </header>
  <div id="view-desc"></div>
  <div id="landing" hidden></div>
  <main>
    <aside id="legend"></aside>
    <div id="graph">
      <div id="graph-toolbar">
        <button id="btn-tour" type="button" class="tour-cta" title="Walk through the book's argument one chapter at a time">▶ Take the tour</button>
        <button id="btn-relayout" type="button" title="Re-arrange the nodes">Re-layout</button>
        <button id="btn-fit" type="button" title="Fit the whole view on screen">Fit</button>
        <button id="btn-weak" type="button" title="Show weak links (wiki-links and passing mentions)" aria-pressed="false">+ weak links</button>
      </div>
      <div id="focus-hint" hidden></div>
      <div id="tour-bar" hidden>
        <button id="tour-close" type="button" title="End the tour" aria-label="End the tour">✕</button>
        <button id="tour-prev" type="button">◀</button>
        <span id="tour-status"></span>
        <button id="tour-next" type="button">▶</button>
      </div>
    </div>
    <aside id="detail"><div class="empty">Click a node to inspect.</div></aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
